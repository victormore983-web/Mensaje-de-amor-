<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#ff69b4">
  <title>Vic Persi</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Satisfy&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #bg {
      position: fixed;
      inset: 0;
      background: url('https://raw.githubusercontent.com/BerMatCode/Dia-de-la-Madre/main/res/Foto%20de%20fondo.jpg') center/cover no-repeat;
      filter: blur(2px) brightness(0.93);
      transform: scale(1.03);
      z-index: -2;
      transition: background-image 0.5s ease, filter 0.5s ease;
    }

    #bg.s2 {
      background-image: url('https://raw.githubusercontent.com/BerMatCode/Dia-de-la-Madre/main/res/5d83633aa7e45db3019baa6168670356.jpg') !important;
      filter: blur(0.4px) brightness(0.96) !important;
    }

    #bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(255,250,253,0.5) 0%, rgba(255,235,242,0.25) 100%);
      transition: background 0.5s ease;
    }

    #bg.s2::after {
      background: radial-gradient(ellipse at center, rgba(255,250,253,0.35) 0%, rgba(255,245,250,0.15) 100%) !important;
    }

    .s {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px;
      transition: opacity 0.5s ease, transform 0.5s ease;
      z-index: 10;
    }

    .s.h { opacity: 0; pointer-events: none; transform: scale(0.97); }
    .s.a { opacity: 1; pointer-events: all; transform: scale(1); }

    #s1 { text-align: center; }

    #s1 .txt {
      font-family: 'Pacifico', cursive;
      font-size: clamp(1.1rem, 3.5vw, 1.6rem);
      color: #fff;
      margin-bottom: 18px;
      animation: glow 2s ease-in-out infinite;
      z-index: 20;
      text-align: center;
      line-height: 1.25;
      max-width: 90%;
    }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 3px rgba(0,0,0,0.9), 0 0 14px rgba(255,255,255,0.95), 0 0 28px rgba(255,255,255,0.85); }
      50%      { text-shadow: 0 0 4px rgba(0,0,0,0.95), 0 0 20px rgba(255,255,255,1), 0 0 40px rgba(255,255,255,0.9), 0 0 60px rgba(255,209,220,0.8); }
    }

    #s1 .box {
      width: clamp(180px, 46vw, 320px);
      cursor: pointer;
      filter: drop-shadow(0 8px 22px rgba(0,0,0,0.2));
      animation: float 3s ease-in-out infinite;
      z-index: 20;
    }

    #s1 .box:hover { transform: scale(1.04); filter: drop-shadow(0 10px 28px rgba(255,105,180,0.3)); }
    #s1 .box.op { animation: pop 0.7s ease forwards; }

    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes pop   { 0% { transform: scale(1); opacity:1; } 50% { transform: scale(1.1); opacity:0.9; } 100% { transform: scale(0); opacity:0; } }

    #s2 { justify-content: center; padding: 10px; }

    .letter {
      width: 100%;
      max-width: 520px;
      z-index: 20;
      animation: up 0.7s ease-out;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes up {
      from { opacity: 0; transform: translateY(35px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .paper {
      background: url('https://raw.githubusercontent.com/BerMatCode/Dia-de-la-Madre/main/res/fondop.png') center/contain no-repeat;
      width: 100%;
      padding: 180px 55px 45px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 640px;
    }

    .letter .t {
      font-family: 'Pacifico', cursive;
      font-size: clamp(1.9rem, 5.2vw, 2.8rem);
      color: #ff2d75;
      text-align: center;
      margin-top: 30px;
      margin-bottom: 12px;
      text-shadow: 
        0 0 5px #ff2d75,
        0 0 10px #ff2d75,
        0 0 20px #ff2d75,
        0 0 40px #ff1a5a,
        0 0 70px #ff1a5a,
        0 0 100px #ff1a5a,
        0 0 2px #fff;
      animation: neon 2s ease-in-out infinite alternate;
      position: relative;
      z-index: 2;
      -webkit-text-stroke: 0.5px rgba(255,255,255,0.5);
    }

    @keyframes neon {
      from {
        text-shadow: 
          0 0 5px #ff2d75,
          0 0 10px #ff2d75,
          0 0 20px #ff2d75,
          0 0 40px #ff1a5a,
          0 0 70px #ff1a5a,
          0 0 2px #fff;
      }
      to {
        text-shadow: 
          0 0 8px #ff2d75,
          0 0 15px #ff2d75,
          0 0 30px #ff2d75,
          0 0 60px #ff1a5a,
          0 0 100px #ff1a5a,
          0 0 130px #ff0a40,
          0 0 3px #fff;
      }
    }

    .letter .p {
      font-family: 'Pacifico', cursive;
      font-size: clamp(1.15rem, 3vw, 1.6rem);
      color: #2a0a1a;
      text-align: center;
      line-height: 1.3;
      letter-spacing: 0.2px;
      word-spacing: 0px;
      margin-bottom: 12px;
      position: relative;
      z-index: 2;
      text-shadow: 
        0 0 1px rgba(255,255,255,0.6),
        0 0 3px rgba(255,255,255,0.3);
      font-weight: 600;
      min-height: 120px;
    }

    .butterfly {
      display: inline-block;
      font-size: 1.3em;
      vertical-align: middle;
      margin-right: 2px;
      animation: butterfly-fly 0.6s ease-in-out infinite alternate;
    }

    @keyframes butterfly-fly {
      0%   { transform: translateY(0px) rotate(-5deg); }
      100% { transform: translateY(-3px) rotate(5deg); }
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background: #2a0a1a;
      vertical-align: middle;
      margin-left: 1px;
      animation: blink 0.7s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .letter .p .hrt {
      color: #d61a5a;
      animation: beat 1.3s ease-in-out infinite;
      display: inline-block;
      font-size: 0.95em;
    }

    @keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }

    .bouquet {
      width: clamp(155px, 36vw, 230px);
      display: block;
      margin: 6px auto 0;
      filter: drop-shadow(0 6px 20px rgba(196,69,130,0.25));
      animation: bloom 1.1s ease-out, gentle 2.8s ease-in-out 1.2s infinite;
      position: relative;
      z-index: 2;
    }

    @keyframes bloom {
      0%   { transform: scale(0) rotate(-6deg); opacity: 0; }
      60%  { transform: scale(1.05) rotate(1deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); }
    }

    @keyframes gentle {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-7px) scale(1.015); }
    }

    .cr {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Pacifico', cursive;
      font-size: clamp(0.9rem, 2.4vw, 1.15rem);
      color: #fff;
      z-index: 100;
      animation: cglow 2.5s ease-in-out infinite alternate;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    @keyframes cglow {
      from { text-shadow: 0 0 3px rgba(0,0,0,0.9), 0 0 14px rgba(255,255,255,0.95), 0 0 28px rgba(255,255,255,0.85); }
      to   { text-shadow: 0 0 4px rgba(0,0,0,0.95), 0 0 22px rgba(255,255,255,1), 0 0 45px rgba(255,255,255,0.9), 0 0 70px rgba(255,235,245,0.8); }
    }

    @media (max-width: 480px) {
      .paper { padding: 160px 45px 40px; min-height: 560px; }
      .letter .t { margin-top: 25px; font-size: 2.1rem; margin-bottom: 10px; }
      .letter .p { font-size: 1.3rem; line-height: 1.25; margin-bottom: 10px; }
      .bouquet { width: 170px; }
    }
  </style>
</head>
<body>

  <div id="bg"></div>

  <audio id="bgMusic" loop preload="auto">
    <source src="Esamor.mp3" type="audio/mpeg">
    Tu navegador no soporta el elemento de audio.
  </audio>

  <div id="s1" class="s a">
    <p class="txt">Toca la caja para abrir</p>
    <img class="box" id="box" src="https://raw.githubusercontent.com/BerMatCode/Dia-de-la-Madre/main/res/caja%20de%20regalo.png" alt="" draggable="false">
  </div>

  <div id="s2" class="s h">
    <div class="letter">
      <div class="paper">
        <h1 class="t">Para ti ❤️❤️</h1>
        <p class="p" id="typewriter"></p>
        <img class="bouquet" src="https://raw.githubusercontent.com/BerMatCode/Dia-de-la-Madre/main/res/ramo.png" alt="" draggable="false">
      </div>
    </div>
  </div>

  <div class="cr">𖤍VIC❤️PERSI𖤍</div>

  <script>
    const B = document.getElementById('box');
    const S1 = document.getElementById('s1');
    const S2 = document.getElementById('s2');
    const typewriterEl = document.getElementById('typewriter');
    const bgMusic = document.getElementById('bgMusic');
    const bg = document.getElementById('bg'); 

    const textToType = `En este día tan especial, quiero recordarte lo mucho que te amo.\nEres mi luz, mi fuerza y mi mayor inspiración.\nGracias por cada abrazo, cada consejo y todo tu amor incondicional.\n\nUn detalle  ❤️\De Vic Persi programardor y diseñador grafico ...`;

    let charIndex = 0;
    let typingStarted = false;
    let musicPlayed = false;

    function typeWriter() {
      if (charIndex < textToType.length) {
        const char = textToType.charAt(charIndex);
        
        let displayHTML = '';
        for (let i = 0; i <= charIndex; i++) {
          const c = textToType.charAt(i);
          if (c === '\n') {
            displayHTML += '<br>';
          } else {
            displayHTML += c;
          }
        }
        
        displayHTML += ' <span class="butterfly">🦋</span><span class="cursor"></span>';
        
        typewriterEl.innerHTML = displayHTML;
        
        charIndex++;
        
        let delay = 80;
        if (char === ' ') delay = 60;
        if (char === '\n') delay = 200;
        if (char === '.' || char === ',') delay = 150;
        
        setTimeout(typeWriter, delay);
      } else {
        typewriterEl.innerHTML = typewriterEl.innerHTML.replace('<span class="cursor"></span>', '');
      }
    }

    function startTypewriter() {
      if (!typingStarted) {
        typingStarted = true;
        charIndex = 0;
        typewriterEl.innerHTML = '';
        setTimeout(typeWriter, 800);
      }
    }

    function playMusic() {
      if (!musicPlayed) {
        musicPlayed = true;
        bgMusic.volume = 0.8;
        bgMusic.play().catch(e => {
          console.log('La reproducción automática fue bloqueada:', e);
          document.addEventListener('touchstart', () => bgMusic.play().catch(()=>{}), { once: true });
          document.addEventListener('click', () => bgMusic.play().catch(()=>{}), { once: true });
        });
      }
    }

    function updateThemeColor(color) {
      let themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta) {
        themeMeta.setAttribute('content', color);
      } else {
        themeMeta = document.createElement('meta');
        themeMeta.name = 'theme-color';
        themeMeta.content = color;
        document.head.appendChild(themeMeta);
      }
    }

    B.addEventListener('click', (e) => {
      e.preventDefault();
      if (B.classList.contains('op')) return;
      
      playMusic();
      
      B.classList.add('op');
      
      setTimeout(() => {
        S1.classList.replace('a', 'h');
        
        setTimeout(() => {
          S2.classList.replace('h', 'a');
          
          bg.classList.add('s2');
          
          updateThemeColor('#ffd700');
          
          startTypewriter();
        }, 250);
      }, 700);
    });

    B.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!B.classList.contains('op')) {
        playMusic();
      }
    }, { passive: false });

    bgMusic.addEventListener('ended', () => {
      bgMusic.currentTime = 0;
      bgMusic.play().catch(()=>{});
    });
  </script>

</body>
</html>
